<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start JS</title>
  </head>
  <body id="body">
    <!-- <button id="change" type="button">Change color</button> -->
    <div class="5.1">
      <h2>Підряхунок суми чисел в рядку.</h2>
      <form action="submit" class="form-js">
        <input name="numbers" type="text" />
        <button type="submit" class="count-btn-js">Count</button>
      </form>
      <p class="result-js">0</p>
      <p class="message-js"></p>
    </div>
    <br>
    <br>
    <div class="5.2">
      <h2>Піднести число до квадрату. Версія 1</h2>
      <input type="number" class="square-num-input" />
      <p class="text-5-2" style="height: 20px; background: rgb(132, 255, 132);">0</p>
      <button class="btn-5-2" type="button">Возвести число в квадрат</button>
      <button type="button" class="btn-5-2-reset">Сбросить</button>
    </div>
    <br>
    <br>
    <div class="5.4">
      <h2>Піднести число до квадрату. Версія 2</h2>
      <input type="number" class="numberInput5-4">
      <button class="value-btn-5-4">2</button>
      <p class="message-5-4-js"></p>
    </div>
    <br>
    <br>
    <script src="./js/tasks.js" type="module"></script>
    <script src="./js/info.js" type="module"></script>
    <script src="./js/cart.js" type="module"></script>
  </body>
</html>
